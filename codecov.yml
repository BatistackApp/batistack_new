codecov:
  require_ci_to_pass: yes

flag_management:
  default_rules:
    carryforward: true

flags:
  Accounting:
    paths:
      - 'app/Enums/Accounting/**'
      - 'app/Models/Accounting/**'
      - 'app/Services/Accounting/**'
      - 'app/Observers/Banque/**'
      - 'app/Filament/Banque/Resources/Accounting/**'
      - 'tests/Feature/Modules/Accounting/**'
    carryforward: true
  Articles:
    paths:
      - 'app/Filament/Articles/**'
      - 'tests/Feature/Modules/Articles/**'
    carryforward: true
  Banque:
    paths:
      - 'app/Models/Banque/**'
      - 'app/Services/Banque/**'
      - 'app/Observers/Banque/**'
      - 'app/Filament/Banque/**'
      - 'tests/Feature/Modules/Banque/**'
    carryforward: true
  Chantiers:
    paths:
      - 'app/Filament/Chantier/**'
      - 'tests/Feature/Modules/Chantiers/**'
    carryforward: true
  Commerce:
    paths:
      - 'app/Filament/Commerce/**'
      - 'tests/Feature/Modules/Commerce/**'
    carryforward: true
  Core:
    paths:
      - 'app/**'
      - 'tests/**'
    carryforward: true
  Flottes:
    paths:
      - 'app/Filament/Flottes/**'
      - 'tests/Feature/Modules/Flottes/**'
    carryforward: true
  RH:
    paths:
      - 'app/Filament/RH/**'
      - 'tests/Feature/Modules/RH/**'
    carryforward: true
  Tiers:
    paths:
      - 'app/Filament/Tiers/**'
      - 'tests/Feature/Modules/Tiers/**'
    carryforward: true
