codecov:
  require_ci_to_pass: yes

coverage:
  status:
    # La couverture projet reste le vrai juge qualité (target auto sur la base).
    project:
      default:
        informational: false
    # Le patch status est informatif : un gate bloquant sur le % de diff est
    # contre-productif sur les grosses PR (type release) où migrations, vues
    # et resources Filament font exploser le diff. Le % reste visible dans les
    # checks et les commentaires Codecov.
    patch:
      default:
        informational: true

flag_management:
  default_rules:
    carryforward: true

flags:
  Accounting:
    paths:
      - 'app/Enums/Accounting/**'
      - 'app/Models/Accounting/**'
      - 'app/Services/Accounting/**'
      - 'app/Observers/Banque/**'
      - 'app/Filament/Banque/Resources/Accounting/**'
      - 'tests/Feature/Modules/Accounting/**'
    carryforward: true
  Articles:
    paths:
      - 'app/Filament/Articles/**'
      - 'tests/Feature/Modules/Articles/**'
    carryforward: true
  Banque:
    paths:
      - 'app/Models/Banque/**'
      - 'app/Services/Banque/**'
      - 'app/Observers/Banque/**'
      - 'app/Filament/Banque/**'
      - 'tests/Feature/Modules/Banque/**'
    carryforward: true
  Chantiers:
    paths:
      - 'app/Filament/Chantier/**'
      - 'tests/Feature/Modules/Chantiers/**'
    carryforward: true
  Commerce:
    paths:
      - 'app/Filament/Commerce/**'
      - 'tests/Feature/Modules/Commerce/**'
    carryforward: true
  Core:
    paths:
      - 'app/**'
      - 'tests/**'
    carryforward: true
  Flottes:
    paths:
      - 'app/Filament/Flottes/**'
      - 'tests/Feature/Modules/Flottes/**'
    carryforward: true
  RH:
    paths:
      - 'app/Filament/RH/**'
      - 'tests/Feature/Modules/RH/**'
    carryforward: true
  Tiers:
    paths:
      - 'app/Filament/Tiers/**'
      - 'tests/Feature/Modules/Tiers/**'
    carryforward: true
