name: 🔒 Security Deep Scan

on:
  pull_request:
    branches: [ production ]
    types: [ opened ]
  schedule:
    - cron: '0 3 * * *' # Scan quotidien à 3h
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type de scan de sécurité'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - secrets-only
          - dependencies-only
          - vulnerabilities-only
      create_issue:
        description: 'Créer une issue en cas de vulnérabilité critique'
        required: false
        default: 'true'
        type: boolean

permissions:
  issues: write
  pull-requests: write
  contents: write

env:
  PHP_VERSION: '8.3'

jobs:
  security-deep-scan:
    name: 🔒 Analyse de sécurité approfondie
    runs-on: ubuntu-latest
    outputs:
      critical-vulnerabilities: ${{ steps.vulnerability-check.outputs.critical-count }}
      secrets-found: ${{ steps.secrets-scan.outputs.secrets-count }}
      security-status: ${{ steps.security-summary.outputs.status }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Historique complet pour l'analyse des secrets

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick

      - name: Create database.sqlite
        run: touch database/database.sqlite

      - name: 📦 Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: 📁 Create security reports directory
        run: mkdir -p reports/security

      - name: 🛡️ Advanced secrets detection
        id: secrets-scan
        continue-on-error: true
        if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'secrets-only' || github.event.inputs.scan_type == ''
        run: |
          echo "🔍 Recherche avancée de secrets..."

          # Scan avec TruffleHog (plus approfondi que module-ci.yml)
          docker run --rm -v "$PWD:/pwd" trufflesecurity/trufflehog:latest filesystem /pwd \
            --json --no-update > reports/security/trufflehog-detailed.json || true

          # Analyse personnalisée pour les patterns Laravel spécifiques
          echo "🔍 Recherche de patterns Laravel sensibles..."

          # Recherche de clés API, tokens, mots de passe en dur
          grep -r -n -E "(secret_key)" \
            --include="*.php" --include="*.env*" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=vendor \
            app/ config/ database/ routes/ > reports/security/sensitive-patterns.txt || true

          # Vérification des fichiers .env
          find . -name ".env*" -not -name ".env.example" -not -name ".env.github" \
            -not -path "./node_modules/*" -not -path "./vendor/*" \
            -exec echo "⚠️ Fichier .env détecté: {}" \; > reports/security/env-files.txt || true

          # Compter les secrets trouvés
          SECRETS_COUNT=$(wc -l < reports/security/sensitive-patterns.txt || echo "0")
          echo "secrets-count=$SECRETS_COUNT" >> $GITHUB_OUTPUT

          # Créer un résumé structuré des secrets pour l'issue
          if [ "$SECRETS_COUNT" -gt 0 ]; then
            echo "⚠️ $SECRETS_COUNT patterns sensibles détectés"

            # Créer un résumé des types de secrets détectés
            echo "### 🔑 Résumé des Secrets Détectés" > reports/security/secrets-summary.md
            echo "" >> reports/security/secrets-summary.md
            echo "**Total détections**: $SECRETS_COUNT" >> reports/security/secrets-summary.md
            echo "" >> reports/security/secrets-summary.md

            # Analyser les types de patterns
            if grep -q "api_key" reports/security/sensitive-patterns.txt; then
              API_KEYS=$(grep -c "api_key" reports/security/sensitive-patterns.txt || echo "0")
              echo "- 🔑 **Clés API**: $API_KEYS détections" >> reports/security/secrets-summary.md
            fi

            if grep -q "password" reports/security/sensitive-patterns.txt; then
              PASSWORDS=$(grep -c "password" reports/security/sensitive-patterns.txt || echo "0")
              echo "- 🔒 **Mots de passe**: $PASSWORDS détections" >> reports/security/secrets-summary.md
            fi

            if grep -q "token" reports/security/sensitive-patterns.txt; then
              TOKENS=$(grep -c "token" reports/security/sensitive-patterns.txt || echo "0")
              echo "- 🎫 **Tokens**: $TOKENS détections" >> reports/security/secrets-summary.md
            fi

            if grep -q "secret" reports/security/sensitive-patterns.txt; then
              SECRETS=$(grep -c "secret" reports/security/sensitive-patterns.txt || echo "0")
              echo "- 🤫 **Secrets**: $SECRETS détections" >> reports/security/secrets-summary.md
            fi

            echo "" >> reports/security/secrets-summary.md
            echo "> ⚠️ **Action immédiate requise**: Tous ces éléments doivent être supprimés du code source." >> reports/security/secrets-summary.md
          else
            echo "✅ Aucun pattern sensible détecté"
            echo "### 🔑 Secrets et Patterns Sensibles" > reports/security/secrets-summary.md
            echo "✅ **Aucun secret détecté** - Le code source est propre." >> reports/security/secrets-summary.md
          fi

      - name: 🔍 Vulnerability assessment
        id: vulnerability-check
        continue-on-error: true
        if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'vulnerabilities-only' || github.event.inputs.scan_type == ''
        run: |
          echo "🔍 Évaluation des vulnérabilités..."

          # Audit Composer avec détails
          composer audit --format=json > reports/security/composer-audit.json || true

          # Analyse des permissions de fichiers sensibles
          echo "🔒 Vérification des permissions de fichiers..."
          find storage/ -type f -name "*.log" -exec ls -la {} \; > reports/security/file-permissions.txt || true
          find . -name "*.env*" -exec ls -la {} \; >> reports/security/file-permissions.txt || true

          # Vérification de la configuration de sécurité Laravel
          echo "🛡️ Vérification de la configuration de sécurité Laravel..."
          php artisan config:show app.debug > reports/security/laravel-config.txt || echo "Debug mode check failed"

          # Compter les vulnérabilités critiques
          CRITICAL_COUNT=$(jq '[.[] | select(.severity == "high" or .severity == "critical")] | length' reports/security/composer-audit.json 2>/dev/null || echo "0")
          echo "critical-count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT

          echo "🔍 Vulnérabilités critiques trouvées: $CRITICAL_COUNT"

      - name: 🔒 Advanced SARIF security analysis
        continue-on-error: true
        if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'vulnerabilities-only' || github.event.inputs.scan_type == ''
        run: |
          echo "🔒 Analyse SARIF avancée..."

          # Installation de outils de sécurité supplémentaires
          composer require --dev vimeo/psalm || true

          # Analyse Psalm pour la sécurité
          ./vendor/bin/psalm --output-format=json > reports/security/psalm-security.json || true

          # Vérification des en-têtes de sécurité dans les réponses
          echo "🛡️ Vérification de la configuration de sécurité web..."
          grep -r "X-Frame-Options\|Content-Security-Policy\|X-XSS-Protection" config/ > reports/security/security-headers.txt || true

      - name: 📊 Security summary
        id: security-summary
        run: |
          echo "📊 Génération du résumé de sécurité..."

          CRITICAL_VULNS="${{ steps.vulnerability-check.outputs.critical-count || '0' }}"
          SECRETS_FOUND="${{ steps.secrets-scan.outputs.secrets-count || '0' }}"

          # Déterminer le statut global
          if [ "$CRITICAL_VULNS" -gt 0 ] || [ "$SECRETS_FOUND" -gt 0 ]; then
            SECURITY_STATUS="failed"
            echo "❌ Problèmes de sécurité détectés"
          else
            SECURITY_STATUS="success"
            echo "✅ Aucun problème de sécurité critique détecté"
          fi

          echo "status=$SECURITY_STATUS" >> $GITHUB_OUTPUT

          # Créer un rapport de sécurité détaillé
          cat > reports/security/security-summary.md << EOF
          # 🔒 Rapport de Sécurité - $(date)

          ## 🎯 Statut Global: $([ "$SECURITY_STATUS" = "success" ] && echo "✅ SÉCURISÉ" || echo "❌ VULNÉRABILITÉS DÉTECTÉES")

          ## 📊 Résumé des Analyses
          - **Vulnérabilités critiques**: $CRITICAL_VULNS
          - **Secrets détectés**: $SECRETS_FOUND
          - **Branche analysée**: ${{ github.ref_name }}
          - **Type de scan**: ${{ github.event.inputs.scan_type || 'full' }}

          ## 🔍 Détails des Analyses
          ### 🛡️ Détection de Secrets
          - Scan TruffleHog approfondi avec historique complet
          - Recherche de patterns Laravel spécifiques
          - Vérification des fichiers .env

          ### 🔍 Évaluation des Vulnérabilités
          - Audit Composer avec classification par sévérité
          - Vérification des permissions de fichiers
          - Analyse de la configuration Laravel

          ### 🔒 Analyse SARIF
          - Scan Psalm pour la sécurité du code
          - Vérification des en-têtes de sécurité web
          EOF

          # Rapport des problèmes critiques détectés (non-bloquant)
          if [ "$SECURITY_STATUS" = "failed" ]; then
            echo "🚫 Scan de sécurité - Vulnérabilités critiques détectées (non-bloquant)"
            echo "⚠️ Le workflow continue pour générer les rapports complets"
          fi

      - name: 📤 Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-deep-scan-${{ github.sha }}
          path: reports/security/
          retention-days: 90 # Conserver plus longtemps pour la sécurité

  dependency-check:
    name: 🔍 Analyse OWASP des dépendances
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'dependencies-only' || github.event.inputs.scan_type == ''
    outputs:
      dependency-vulnerabilities: ${{ steps.dependency-analysis.outputs.vuln-count }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

      - name: 📦 Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node.js dependencies
        run: |
          echo "📦 Installation des dépendances Node.js..."
          npm install
          npm ci --prefer-offline --no-audit
          echo "✅ Dépendances Node.js installées"

      - name: 📁 Create dependency reports directory
        run: mkdir -p reports/dependencies

      - name: 🔍 Validate suppression file
        run: |
          echo "🔍 Validation du fichier de suppression..."
          if [ -f "dependency-check-suppressions.xml" ]; then
            echo "✅ Fichier de suppression trouvé"

            # Vérifier la syntaxe XML avec Python (plus fiable que xmllint)
            python3 -c "
            import xml.etree.ElementTree as ET
            import sys
            try:
                ET.parse('dependency-check-suppressions.xml')
                print('✅ Syntaxe XML valide')
                sys.exit(0)
            except ET.ParseError as e:
                print(f'❌ Erreur de syntaxe XML: {e}')
                sys.exit(1)
            except Exception as e:
                print(f'⚠️ Erreur lors de la validation: {e}')
                sys.exit(1)
            " || {
              echo "❌ Fichier XML invalide - création d'un fichier de remplacement"
              cat > dependency-check-suppressions.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <suppressions xmlns="https://jeremylong.github.io/DependencyCheck/dependency-suppression.1.3.xsd">
              <!-- Fichier de suppression généré automatiquement -->
              <suppress>
                  <notes><![CDATA[Suppression générique pour les faux positifs]]></notes>
                  <cpe>cpe:/a:*:*</cpe>
              </suppress>
          </suppressions>
          EOF
            }

            # Vérifier que le fichier contient les éléments requis
            if grep -q "<suppress>" dependency-check-suppressions.xml; then
              echo "✅ Structure de suppression valide"
            else
              echo "ℹ️ Aucune suppression définie - fichier minimal"
            fi
          else
            echo "⚠️ Fichier de suppression non trouvé - création d'un fichier minimal"
            cat > dependency-check-suppressions.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <suppressions xmlns="https://jeremylong.github.io/DependencyCheck/dependency-suppression.1.3.xsd">
              <!-- Fichier de suppression minimal -->
          </suppressions>
          EOF
          fi

      - name: 🔍 OWASP Dependency Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Batistack'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
            --out reports/dependencies/
            --suppression dependency-check-suppressions.xml
            --exclude "**/node_modules/**"
            --exclude "**/vendor/**"
            --exclude "**/storage/**"
            --exclude "**/bootstrap/cache/**"

      - name: 📊 Analyze dependency results
        id: dependency-analysis
        run: |
          echo "📊 Analyse des résultats de dépendances..."

          # Vérifier quels rapports ont été générés
          echo "🔍 Vérification des rapports générés..."
          ls -la reports/dependencies/ || echo "Aucun rapport trouvé"

          # Compter les vulnérabilités dans le rapport JSON
          VULN_COUNT=0
          HIGH_VULN_COUNT=0
          CRITICAL_VULN_COUNT=0

          if [ -f "reports/dependencies/dependency-check-report.json" ]; then
            echo "✅ Rapport JSON trouvé - analyse en cours..."

            # Compter toutes les vulnérabilités
            VULN_COUNT=$(jq '[.dependencies[]?.vulnerabilities[]?] | length' reports/dependencies/dependency-check-report.json 2>/dev/null || echo "0")

            # Compter les vulnérabilités critiques et élevées
            HIGH_VULN_COUNT=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.severity == "HIGH")] | length' reports/dependencies/dependency-check-report.json 2>/dev/null || echo "0")
            CRITICAL_VULN_COUNT=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.severity == "CRITICAL")] | length' reports/dependencies/dependency-check-report.json 2>/dev/null || echo "0")

            echo "📊 Analyse détaillée des vulnérabilités:"
            echo "  - Total: $VULN_COUNT"
            echo "  - Critiques: $CRITICAL_VULN_COUNT"
            echo "  - Élevées: $HIGH_VULN_COUNT"
          else
            echo "⚠️ Rapport JSON non trouvé - vérification des autres formats..."

            # Essayer de lire le rapport XML si disponible
            if [ -f "reports/dependencies/dependency-check-report.xml" ]; then
              echo "✅ Rapport XML trouvé"
              VULN_COUNT=$(xmllint --xpath "count(//vulnerability)" reports/dependencies/dependency-check-report.xml 2>/dev/null || echo "0")
            fi
          fi

          echo "vuln-count=$VULN_COUNT" >> $GITHUB_OUTPUT
          echo "high-vuln-count=$HIGH_VULN_COUNT" >> $GITHUB_OUTPUT
          echo "critical-vuln-count=$CRITICAL_VULN_COUNT" >> $GITHUB_OUTPUT

          echo "🔍 Résumé des vulnérabilités de dépendances:"
          echo "  - Total: $VULN_COUNT"
          echo "  - Critiques: $CRITICAL_VULN_COUNT"
          echo "  - Élevées: $HIGH_VULN_COUNT"

          # Créer un résumé détaillé des dépendances
          cat > reports/dependencies/dependency-summary.md << EOF
          # 🔍 Rapport d'Analyse des Dépendances - $(date)

          ## 📊 Résumé OWASP Dependency Check
          - **Vulnérabilités totales**: $VULN_COUNT
          - **Vulnérabilités critiques**: $CRITICAL_VULN_COUNT
          - **Vulnérabilités élevées**: $HIGH_VULN_COUNT
          - **Projet**: Batistack
          - **Branche**: ${{ github.ref_name }}
          - **Commit**: ${{ github.sha }}

          ## 🎯 Statut de Sécurité
          $(if [ "$CRITICAL_VULN_COUNT" -gt 0 ]; then
            echo "🔴 **CRITIQUE** - Vulnérabilités critiques détectées"
          elif [ "$HIGH_VULN_COUNT" -gt 0 ]; then
            echo "🟡 **ATTENTION** - Vulnérabilités élevées détectées"
          elif [ "$VULN_COUNT" -gt 0 ]; then
            echo "🟢 **ACCEPTABLE** - Vulnérabilités mineures détectées"
          else
            echo "✅ **SÉCURISÉ** - Aucune vulnérabilité détectée"
          fi)

          ## 🔗 Rapports Générés
          $(ls -la reports/dependencies/ | grep -E '\.(html|json|xml|csv)$' | awk '{print "- " $9}' || echo "- Aucun rapport disponible")

          ## 📋 Actions Recommandées
          $(if [ "$CRITICAL_VULN_COUNT" -gt 0 ]; then
            echo "- 🚨 **URGENT**: Corriger immédiatement les vulnérabilités critiques"
            echo "- 📦 Mettre à jour les dépendances vulnérables"
            echo "- 🔍 Vérifier les alternatives sécurisées"
          elif [ "$HIGH_VULN_COUNT" -gt 0 ]; then
            echo "- ⚠️ Planifier la correction des vulnérabilités élevées"
            echo "- 📦 Mettre à jour les dépendances concernées"
          elif [ "$VULN_COUNT" -gt 0 ]; then
            echo "- 📝 Évaluer l'impact des vulnérabilités mineures"
            echo "- 📅 Planifier les mises à jour lors du prochain cycle"
          else
            echo "- ✅ Continuer la surveillance régulière"
            echo "- 📅 Maintenir les dépendances à jour"
          fi)
          EOF

          # Afficher un résumé dans les logs
          if [ "$CRITICAL_VULN_COUNT" -gt 0 ]; then
            echo "🚨 ALERTE CRITIQUE: $CRITICAL_VULN_COUNT vulnérabilités critiques détectées!"
          elif [ "$HIGH_VULN_COUNT" -gt 0 ]; then
            echo "⚠️ ATTENTION: $HIGH_VULN_COUNT vulnérabilités élevées détectées"
          elif [ "$VULN_COUNT" -gt 0 ]; then
            echo "ℹ️ INFO: $VULN_COUNT vulnérabilités mineures détectées"
          else
            echo "✅ SUCCÈS: Aucune vulnérabilité détectée"
          fi

      - name: 📤 Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-${{ github.sha }}
          path: reports/dependencies/
          retention-days: 60

  security-notifications:
    name: 🚨 Notifications de Sécurité
    runs-on: ubuntu-latest
    needs: [security-deep-scan, dependency-check]
    if: always()
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 📥 Download security reports
        if: always()
        uses: actions/download-artifact@v5
        with:
          pattern: '*-${{ github.sha }}'
          path: ./security-reports/
          merge-multiple: true

      - name: 🔍 Extract vulnerability details
        id: extract-details
        if: always()
        run: |
          echo "🔍 Extraction des détails des vulnérabilités..."

          # Créer les répertoires nécessaires
          mkdir -p ./extracted-details

          # Initialiser les variables
          SECRETS_DETAILS=""
          DEPENDENCY_DETAILS=""
          CODE_VULNS_DETAILS=""

          # === EXTRACTION DES SECRETS ===
          echo "🔑 Extraction des secrets détectés..."

          # Utiliser d'abord le résumé structuré s'il existe
          if [ -f "./security-reports/secrets-summary.md" ]; then
            echo "✅ Utilisation du résumé structuré des secrets"

            # Copier d'abord le résumé structuré
            cp "./security-reports/secrets-summary.md" ./extracted-details/secrets.md

            # Ajouter les détails si des secrets ont été trouvés
            if [ -f "./security-reports/sensitive-patterns.txt" ] && [ -s "./security-reports/sensitive-patterns.txt" ]; then
              echo "" >> ./extracted-details/secrets.md
              echo "#### 📋 Détails des Détections" >> ./extracted-details/secrets.md
              echo "" >> ./extracted-details/secrets.md
              echo "| Fichier | Ligne | Pattern Détecté |" >> ./extracted-details/secrets.md
              echo "|---------|-------|-----------------|" >> ./extracted-details/secrets.md

              # Traiter les patterns sensibles (limiter à 15 pour éviter les issues trop longues)
              head -15 "./security-reports/sensitive-patterns.txt" | while IFS=':' read -r file line content; do
                if [ -n "$file" ] && [ -n "$line" ] && [ -n "$content" ]; then
                  # Nettoyer le contenu pour éviter les caractères problématiques
                  clean_content=$(echo "$content" | sed 's/|/\\|/g' | sed 's/`/\\`/g' | cut -c1-80)
                  clean_file=$(echo "$file" | sed 's/|/\\|/g')
                  echo "| \`$clean_file\` | $line | \`$clean_content...\` |" >> ./extracted-details/secrets.md
                fi
              done

              # Ajouter un avertissement si plus de 15 détections
              total_secrets=$(wc -l < "./security-reports/sensitive-patterns.txt" 2>/dev/null || echo "0")
              if [ "$total_secrets" -gt 15 ]; then
                echo "" >> ./extracted-details/secrets.md
                echo "> ⚠️ **Note**: Seules les 15 premières détections sont affichées. Total: $total_secrets détections." >> ./extracted-details/secrets.md
                echo "> Consultez les rapports complets dans les artifacts pour voir toutes les détections." >> ./extracted-details/secrets.md
              fi
            fi

            SECRETS_DETAILS=$(cat ./extracted-details/secrets.md)
          elif [ -f "./security-reports/sensitive-patterns.txt" ] && [ -s "./security-reports/sensitive-patterns.txt" ]; then
            echo "⚠️ Utilisation du fallback pour les secrets"
            echo "### 🔑 Secrets et Patterns Sensibles Détectés" > ./extracted-details/secrets.md
            echo "" >> ./extracted-details/secrets.md
            echo "| Fichier | Ligne | Pattern Détecté |" >> ./extracted-details/secrets.md
            echo "|---------|-------|-----------------|" >> ./extracted-details/secrets.md

            # Traiter les patterns sensibles (limiter à 15 pour éviter les issues trop longues)
            head -15 "./security-reports/sensitive-patterns.txt" | while IFS=':' read -r file line content; do
              if [ -n "$file" ] && [ -n "$line" ] && [ -n "$content" ]; then
                # Nettoyer le contenu pour éviter les caractères problématiques
                clean_content=$(echo "$content" | sed 's/|/\\|/g' | sed 's/`/\\`/g' | cut -c1-80)
                clean_file=$(echo "$file" | sed 's/|/\\|/g')
                echo "| \`$clean_file\` | $line | \`$clean_content...\` |" >> ./extracted-details/secrets.md
              fi
            done

            total_secrets=$(wc -l < "./security-reports/sensitive-patterns.txt" 2>/dev/null || echo "0")
            if [ "$total_secrets" -gt 15 ]; then
              echo "" >> ./extracted-details/secrets.md
              echo "> ⚠️ **Note**: Seules les 15 premières détections sont affichées. Total: $total_secrets détections." >> ./extracted-details/secrets.md
            fi

            SECRETS_DETAILS=$(cat ./extracted-details/secrets.md)
          else
            echo "✅ Aucun secret détecté"
            SECRETS_DETAILS="### 🔑 Secrets et Patterns Sensibles\n✅ Aucun secret ou pattern sensible détecté."
          fi

          # === EXTRACTION DES VULNÉRABILITÉS DE DÉPENDANCES ===
          echo "📦 Extraction des vulnérabilités de dépendances..."

          # Utiliser d'abord le résumé structuré s'il existe
          if [ -f "./security-reports/dependency-summary.md" ]; then
            echo "✅ Utilisation du résumé structuré des dépendances"
            DEPENDENCIES_DETAILS=$(cat "./security-reports/dependency-summary.md")

             # Ajouter les détails si des vulnérabilités ont été trouvées
             if [ -f "./security-reports/dependency-check-report.json" ]; then
               # Vérifier s'il y a des vulnérabilités critiques ou élevées
               critical_count=$(jq -r '[.dependencies[]?.vulnerabilities[]? | select(.severity == "CRITICAL")] | length' "./security-reports/dependency-check-report.json" 2>/dev/null || echo "0")
               high_count=$(jq -r '[.dependencies[]?.vulnerabilities[]? | select(.severity == "HIGH")] | length' "./security-reports/dependency-check-report.json" 2>/dev/null || echo "0")

               if [ "$critical_count" -gt 0 ] || [ "$high_count" -gt 0 ]; then
                 echo "" >> ./extracted-details/dependencies.md
                 echo "#### 📋 Détails des Vulnérabilités" >> ./extracted-details/dependencies.md
                 echo "" >> ./extracted-details/dependencies.md

                 # Extraire les vulnérabilités critiques (limiter à 8)
                 if [ "$critical_count" -gt 0 ]; then
                   echo "##### 🔴 Vulnérabilités Critiques ($critical_count)" >> ./extracted-details/dependencies.md
                   echo "" >> ./extracted-details/dependencies.md
                   jq -r '.dependencies[]? | select(.vulnerabilities[]?.severity == "CRITICAL") | .fileName as $file | .vulnerabilities[] | select(.severity == "CRITICAL") | "- **" + .name + "** dans `" + $file + "`\n  - CVE: " + (.references[]?.name // "N/A") + "\n  - Score: " + (.cvssv3?.baseScore // .cvssv2?.score // "N/A" | tostring) + "\n"' "./security-reports/dependency-check-report.json" 2>/dev/null | head -24 >> ./extracted-details/dependencies.md
                 fi

                 # Extraire les vulnérabilités élevées (limiter à 5)
                 if [ "$high_count" -gt 0 ]; then
                   echo "##### 🟠 Vulnérabilités Élevées ($high_count)" >> ./extracted-details/dependencies.md
                   echo "" >> ./extracted-details/dependencies.md
                   jq -r '.dependencies[]? | select(.vulnerabilities[]?.severity == "HIGH") | .fileName as $file | .vulnerabilities[] | select(.severity == "HIGH") | "- **" + .name + "** dans `" + $file + "`\n  - CVE: " + (.references[]?.name // "N/A") + "\n  - Score: " + (.cvssv3?.baseScore // .cvssv2?.score // "N/A" | tostring) + "\n"' "./security-reports/dependency-check-report.json" 2>/dev/null | head -15 >> ./extracted-details/dependencies.md
                 fi

                 # Ajouter le résumé structuré au début
                 cat "./security-reports/dependency-summary.md" > ./extracted-details/dependencies.md
                 echo "" >> ./extracted-details/dependencies.md
                 cat ./extracted-details/dependencies.md >> ./extracted-details/dependencies.md
               else
                 cat "./security-reports/dependency-summary.md" > ./extracted-details/dependencies.md
               fi
             else
               cat "./security-reports/dependency-summary.md" > ./extracted-details/dependencies.md
             fi

             DEPENDENCIES_DETAILS=$(cat ./extracted-details/dependencies.md)
          elif [ -f "./security-reports/dependency-check-report.json" ]; then
            echo "⚠️ Utilisation du fallback pour les dépendances"
            echo "### 📦 Vulnérabilités de Dépendances" > ./extracted-details/dependencies.md
            echo "" >> ./extracted-details/dependencies.md

            # Extraire les vulnérabilités critiques et élevées
            jq -r '
              .dependencies[]? |
              select(.vulnerabilities != null and (.vulnerabilities | length > 0)) |
              .vulnerabilities[] |
              select(.severity == "CRITICAL" or .severity == "HIGH") |
              "| \(.severity) | \(.name // "N/A") | \(.description // "N/A" | .[0:100]) | \(.references[0].url // "N/A") |"
            ' "./security-reports/dependency-check-report.json" 2>/dev/null > ./extracted-details/dep_vulns.tmp || echo "" > ./extracted-details/dep_vulns.tmp

            if [ -s "./extracted-details/dep_vulns.tmp" ]; then
              echo "| Sévérité | CVE/Vulnérabilité | Description | Référence |" >> ./extracted-details/dependencies.md
              echo "|----------|-------------------|-------------|-----------|" >> ./extracted-details/dependencies.md
              head -15 ./extracted-details/dep_vulns.tmp >> ./extracted-details/dependencies.md

              # Compter le total
              total_dep_vulns=$(wc -l < ./extracted-details/dep_vulns.tmp)
              if [ "$total_dep_vulns" -gt 15 ]; then
                echo "" >> ./extracted-details/dependencies.md
                echo "> ⚠️ **Note**: Seules les 15 vulnérabilités les plus critiques sont affichées. Total: $total_dep_vulns vulnérabilités." >> ./extracted-details/dependencies.md
              fi
            else
              echo "✅ Aucune vulnérabilité critique ou élevée détectée dans les dépendances." >> ./extracted-details/dependencies.md
            fi

            DEPENDENCIES_DETAILS=$(cat ./extracted-details/dependencies.md)
          else
            echo "✅ Aucune vulnérabilité de dépendance détectée"
            DEPENDENCIES_DETAILS="### 📦 Vulnérabilités de Dépendances\n✅ Aucune vulnérabilité détectée dans les dépendances."
          fi

          # === EXTRACTION DES VULNÉRABILITÉS DE CODE ===
          echo "🔍 Extraction des vulnérabilités de code..."
          if [ -f "./security-reports/composer-audit.json" ]; then
            echo "### 🔍 Vulnérabilités de Code (Composer Audit)" > ./extracted-details/code-vulns.md
            echo "" >> ./extracted-details/code-vulns.md

            # Extraire les vulnérabilités du composer audit
            jq -r '
              .[] |
              select(.severity == "high" or .severity == "critical") |
              "| \(.severity | ascii_upcase) | \(.package) | \(.title // "N/A" | .[0:80]) | \(.link // "N/A") |"
            ' "./security-reports/composer-audit.json" 2>/dev/null > ./extracted-details/code_vulns.tmp || echo "" > ./extracted-details/code_vulns.tmp

            if [ -s "./extracted-details/code_vulns.tmp" ]; then
              echo "| Sévérité | Package | Titre | Lien |" >> ./extracted-details/code-vulns.md
              echo "|----------|---------|-------|------|" >> ./extracted-details/code-vulns.md
              head -10 ./extracted-details/code_vulns.tmp >> ./extracted-details/code-vulns.md
            else
              echo "✅ Aucune vulnérabilité critique détectée dans le code." >> ./extracted-details/code-vulns.md
            fi

            CODE_VULNS_DETAILS=$(cat ./extracted-details/code-vulns.md)
          else
            CODE_VULNS_DETAILS="### 🔍 Vulnérabilités de Code\n⚠️ Rapport d'audit de code non disponible."
          fi

          # === EXTRACTION DES FICHIERS .ENV ===
          echo "📁 Extraction des fichiers .env détectés..."
          ENV_FILES_DETAILS=""
          if [ -f "./security-reports/env-files.txt" ] && [ -s "./security-reports/env-files.txt" ]; then
            echo "### 📁 Fichiers .env Détectés" > ./extracted-details/env-files.md
            echo "" >> ./extracted-details/env-files.md
            echo "⚠️ **ATTENTION**: Les fichiers .env suivants ont été détectés :" >> ./extracted-details/env-files.md
            echo "" >> ./extracted-details/env-files.md
            while read -r line; do
              echo "- \`$line\`" >> ./extracted-details/env-files.md
            done < "./security-reports/env-files.txt"
            echo "" >> ./extracted-details/env-files.md
            echo "> 🚨 **Action requise**: Vérifiez que ces fichiers ne sont pas commités dans le repository." >> ./extracted-details/env-files.md

            ENV_FILES_DETAILS=$(cat ./extracted-details/env-files.md)
          else
            ENV_FILES_DETAILS="### 📁 Fichiers .env\n✅ Aucun fichier .env problématique détecté."
          fi

          # === CRÉATION DU RÉSUMÉ GLOBAL ===
          echo "📊 Création du résumé global des détections..."

          # Compter le total des détections
          total_secrets=$(wc -l < "./security-reports/sensitive-patterns.txt" 2>/dev/null || echo "0")
          total_critical_deps=$(jq -r '[.dependencies[]?.vulnerabilities[]? | select(.severity == "CRITICAL")] | length' "./security-reports/dependency-check-report.json" 2>/dev/null || echo "0")
          total_high_deps=$(jq -r '[.dependencies[]?.vulnerabilities[]? | select(.severity == "HIGH")] | length' "./security-reports/dependency-check-report.json" 2>/dev/null || echo "0")
          total_env_files=$(find . -name "*.env*" -type f 2>/dev/null | wc -l || echo "0")

          # Créer un résumé exécutif
          echo "## 📊 Résumé Exécutif des Détections" > ./extracted-details/executive-summary.md
          echo "" >> ./extracted-details/executive-summary.md
          echo "| Type de Détection | Nombre | Priorité |" >> ./extracted-details/executive-summary.md
          echo "|-------------------|--------|----------|" >> ./extracted-details/executive-summary.md
          echo "| 🔑 Secrets détectés | $total_secrets | 🔴 Critique |" >> ./extracted-details/executive-summary.md
          echo "| 📦 Vulnérabilités critiques (deps) | $total_critical_deps | 🔴 Critique |" >> ./extracted-details/executive-summary.md
          echo "| 📦 Vulnérabilités élevées (deps) | $total_high_deps | 🟠 Élevée |" >> ./extracted-details/executive-summary.md
          echo "| 📄 Fichiers .env détectés | $total_env_files | 🟡 Modérée |" >> ./extracted-details/executive-summary.md
          echo "" >> ./extracted-details/executive-summary.md

          # Ajouter des recommandations prioritaires
          echo "### 🎯 Actions Prioritaires" >> ./extracted-details/executive-summary.md
          echo "" >> ./extracted-details/executive-summary.md

          if [ "$total_secrets" -gt 0 ]; then
            echo "1. **🔴 URGENT**: Révocation et rotation des secrets exposés" >> ./extracted-details/executive-summary.md
          fi

          if [ "$total_critical_deps" -gt 0 ]; then
            echo "2. **🔴 CRITIQUE**: Mise à jour des dépendances avec vulnérabilités critiques" >> ./extracted-details/executive-summary.md
          fi

          if [ "$total_high_deps" -gt 0 ]; then
            echo "3. **🟠 IMPORTANT**: Planifier la mise à jour des dépendances à risque élevé" >> ./extracted-details/executive-summary.md
          fi

          if [ "$total_env_files" -gt 0 ]; then
            echo "4. **🟡 RECOMMANDÉ**: Sécuriser les fichiers de configuration" >> ./extracted-details/executive-summary.md
          fi

          if [ "$total_secrets" -eq 0 ] && [ "$total_critical_deps" -eq 0 ] && [ "$total_high_deps" -eq 0 ]; then
            echo "✅ **Aucune action critique requise** - Le projet présente un bon niveau de sécurité" >> ./extracted-details/executive-summary.md
          fi

          EXECUTIVE_SUMMARY=$(cat ./extracted-details/executive-summary.md)

          # === EXPORT DES VARIABLES ===
          echo "EXECUTIVE_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$EXECUTIVE_SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "SECRETS_DETAILS<<EOF" >> $GITHUB_ENV
          echo "$SECRETS_DETAILS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "DEPENDENCY_DETAILS<<EOF" >> $GITHUB_ENV
          echo "$DEPENDENCY_DETAILS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "CODE_VULNS_DETAILS<<EOF" >> $GITHUB_ENV
          echo "$CODE_VULNS_DETAILS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "ENV_FILES_DETAILS<<EOF" >> $GITHUB_ENV
          echo "$ENV_FILES_DETAILS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "✅ Extraction des détails terminée"

      - name: 🚨 Create critical security issue
        if: (needs.security-deep-scan.outputs.critical-vulnerabilities > 0 || needs.dependency-check.outputs.critical-vuln-count > 0 || needs.security-deep-scan.outputs.secrets-found > 0) && (github.event.inputs.create_issue == 'true' || github.event.inputs.create_issue == '')
        uses: actions/github-script@v8
        env:
          EXECUTIVE_SUMMARY: ${{ env.EXECUTIVE_SUMMARY }}
          SECRETS_DETAILS: ${{ env.SECRETS_DETAILS }}
          DEPENDENCIES_DETAILS: ${{ env.DEPENDENCIES_DETAILS }}
          CODE_VULNERABILITIES_DETAILS: ${{ env.CODE_VULNERABILITIES_DETAILS }}
          ENV_FILES_DETAILS: ${{ env.ENV_FILES_DETAILS }}
        with:
          script: |
            const criticalVulns = '${{ needs.security-deep-scan.outputs.critical-vulnerabilities || 0 }}';
            const dependencyVulns = '${{ needs.dependency-check.outputs.dependency-vulnerabilities || 0 }}';
            const criticalDepVulns = '${{ needs.dependency-check.outputs.critical-vuln-count || 0 }}';
            const highDepVulns = '${{ needs.dependency-check.outputs.high-vuln-count || 0 }}';
            const secretsFound = '${{ needs.security-deep-scan.outputs.secrets-found || 0 }}';

            // Déterminer le niveau de criticité
            const isCritical = parseInt(criticalVulns) > 0 || parseInt(criticalDepVulns) > 0 || parseInt(secretsFound) > 0;
            const isHigh = parseInt(highDepVulns) > 0;

            const severity = isCritical ? 'CRITIQUE' : (isHigh ? 'ÉLEVÉE' : 'MODÉRÉE');
            const emoji = isCritical ? '🚨' : (isHigh ? '⚠️' : 'ℹ️');

            const title = `${emoji} ALERTE SÉCURITÉ ${severity} - ${new Date().toISOString().split('T')[0]}`;

            const executiveSummary = process.env.EXECUTIVE_SUMMARY || '';
            const secretsDetails = process.env.SECRETS_DETAILS || '';
            const dependenciesDetails = process.env.DEPENDENCIES_DETAILS || '';
            const codeVulnsDetails = process.env.CODE_VULNERABILITIES_DETAILS || '';
            const envFilesDetails = process.env.ENV_FILES_DETAILS || '';

            const body = `## ${emoji} Vulnérabilités ${severity} Détectées

            Le scan de sécurité approfondi a détecté des vulnérabilités sur la branche \`${{ github.ref_name }}\`.

            ${executiveSummary}

            ### 📊 Résumé Détaillé des Menaces
            - **🔴 Vulnérabilités critiques (code)**: ${criticalVulns}
            - **🔴 Vulnérabilités critiques (dépendances)**: ${criticalDepVulns}
            - **🟡 Vulnérabilités élevées (dépendances)**: ${highDepVulns}
            - **📦 Total vulnérabilités de dépendances**: ${dependencyVulns}
            - **🔑 Secrets/Credentials détectés**: ${secretsFound}

            ### ${isCritical ? '🚨 ACTIONS URGENTES REQUISES' : '📋 ACTIONS RECOMMANDÉES'}
            ${isCritical ? `
            - [ ] **PRIORITÉ 1**: Corriger immédiatement les vulnérabilités critiques
            - [ ] **PRIORITÉ 2**: Supprimer/sécuriser les secrets détectés
            - [ ] **PRIORITÉ 3**: Mettre à jour les dépendances critiques
            - [ ] **PRIORITÉ 4**: Relancer le scan après corrections
            ` : `
            - [ ] Évaluer l'impact des vulnérabilités détectées
            - [ ] Planifier les mises à jour de dépendances
            - [ ] Programmer les corrections dans le prochain sprint
            - [ ] Surveiller les nouvelles vulnérabilités
            `}

            ## 🔍 DÉTAILS DES DÉTECTIONS

            ${secretsDetails}

            ${dependenciesDetails}

            ${codeVulnsDetails}

            ${envFilesDetails}

            ## 📋 GUIDE DE RÉSOLUTION

            ### 🔧 Étapes de Correction Recommandées

            #### Pour les Secrets Détectés:
            1. **Identification**: Vérifiez chaque secret listé ci-dessus
            2. **Suppression**: Retirez les secrets du code source
            3. **Rotation**: Changez immédiatement les clés/tokens compromis
            4. **Sécurisation**: Utilisez des variables d'environnement ou des services de gestion de secrets
            5. **Historique**: Nettoyez l'historique Git si nécessaire

            #### Pour les Vulnérabilités de Dépendances:
            1. **Mise à jour**: \`composer update\` pour les packages PHP
            2. **Vérification**: \`npm audit fix\` pour les packages Node.js
            3. **Alternatives**: Recherchez des alternatives sécurisées si les mises à jour ne sont pas disponibles
            4. **Suppression**: Utilisez le fichier \`dependency-check-suppressions.xml\` pour les faux positifs

            #### Pour les Vulnérabilités de Code:
            1. **Analyse**: Examinez chaque vulnérabilité listée
            2. **Correction**: Appliquez les correctifs recommandés
            3. **Test**: Vérifiez que les corrections n'introduisent pas de régressions
            4. **Documentation**: Documentez les changements effectués

            ### 🔗 Ressources et Rapports
            - [🔗 Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [📝 Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - [📊 Rapports de sécurité détaillés](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [📋 Branche analysée](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }})

            ### 📋 Détails Techniques
            - **Type de scan**: ${{ github.event.inputs.scan_type || 'full' }}
            - **Déclencheur**: ${{ github.event_name }}
            - **Environnement**: ${{ github.ref_name }}
            - **SHA**: \`${{ github.sha }}\`
            - **Date du scan**: ${new Date().toISOString()}

            ### ⚠️ CONFIDENTIALITÉ
            **Cette issue contient des informations sensibles de sécurité.**
            - Ne pas partager publiquement les détails des vulnérabilités
            - Limiter l'accès aux personnes autorisées
            - Traiter avec la plus haute confidentialité
            - Supprimer cette issue après résolution des problèmes

            ### ✅ Validation Post-Correction
            Après avoir corrigé les vulnérabilités:
            1. Relancez le workflow de sécurité: \`workflow_dispatch\`
            2. Vérifiez que tous les scans passent au vert
            3. Fermez cette issue en documentant les actions prises
            4. Considérez un audit de sécurité supplémentaire si nécessaire

            ---
            *Issue créée automatiquement par le Security Deep Scan v3.0*
            *Dernière mise à jour: ${new Date().toISOString()}*`;

            const labels = ['security', 'vulnerability'];
            if (isCritical) {
              labels.push('critical', 'urgent', 'P0');
            } else if (isHigh) {
              labels.push('high', 'P1');
            } else {
              labels.push('medium', 'P2');
            }

            await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: labels
              });

      - name: 📊 Security scan summary
        if: always()
        run: |
          echo "## 🔒 RÉSUMÉ COMPLET DU SCAN DE SÉCURITÉ"
          echo "=================================="
          echo ""
          echo "### 📋 Informations Générales"
          echo "- **Branche**: ${{ github.ref_name }}"
          echo "- **Commit**: ${{ github.sha }}"
          echo "- **Déclencheur**: ${{ github.event_name }}"
          echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "### 🔍 Résultats des Analyses"
          echo "#### Security Deep Scan"
          echo "- Vulnérabilités critiques: ${{ needs.security-deep-scan.outputs.critical-vulnerabilities || 'N/A' }}"
          echo "- Secrets détectés: ${{ needs.security-deep-scan.outputs.secrets-found || 'N/A' }}"
          echo "- Statut: ${{ needs.security-deep-scan.result }}"
          echo ""
          echo "#### Dependency Check"
          echo "- Vulnérabilités critiques: ${{ needs.dependency-check.outputs.critical-vuln-count || 'N/A' }}"
          echo "- Vulnérabilités élevées: ${{ needs.dependency-check.outputs.high-vuln-count || 'N/A' }}"
          echo "- Total vulnérabilités: ${{ needs.dependency-check.outputs.dependency-vulnerabilities || 'N/A' }}"
          echo "- Statut: ${{ needs.dependency-check.result }}"
          echo ""
          echo "### 🎯 Actions Prises"
          if [[ "${{ needs.security-deep-scan.outputs.critical-vulnerabilities || 0 }}" -gt 0 ]] || [[ "${{ needs.dependency-check.outputs.critical-vuln-count || 0 }}" -gt 0 ]] || [[ "${{ needs.security-deep-scan.outputs.secrets-found || 0 }}" -gt 0 ]]; then
            echo "- ✅ Issue de sécurité critique créée"
            echo "- 🚨 Notification d'urgence envoyée"
            echo "- ⚠️ Déploiement bloqué jusqu'à résolution"
          else
            echo "- ✅ Aucune vulnérabilité critique détectée"
            echo "- 🟢 Sécurité validée pour le déploiement"
          fi
          echo ""
          echo "### 📊 Métriques de Performance"
          echo "- Durée Security Deep Scan: ~${{ needs.security-deep-scan.outputs.scan-duration || 'N/A' }}"
          echo "- Durée Dependency Check: ~${{ needs.dependency-check.outputs.scan-duration || 'N/A' }}"
          echo ""
          echo "### 🔗 Liens Utiles"
          echo "- [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          echo "- [Commit Details](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
          echo "- [Security Reports](artifacts)"
          echo ""
          echo "=================================="
          echo "🔒 Scan de sécurité terminé avec succès"

  summary:
    name: 📋 Résumé Sécurité
    runs-on: ubuntu-latest
    needs: [security-deep-scan, dependency-check, security-notifications]
    if: always()
    steps:
      - name: 📋 Generate security summary
        run: |
          echo "## 🔒 Résumé Security Deep Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Statut: ${{ needs.security-deep-scan.outputs.security-status == 'success' && '✅ SÉCURISÉ' || '❌ VULNÉRABILITÉS' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Détections:" >> $GITHUB_STEP_SUMMARY
          echo "- **Vulnérabilités critiques**: ${{ needs.security-deep-scan.outputs.critical-vulnerabilities || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Secrets détectés**: ${{ needs.security-deep-scan.outputs.secrets-found || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vulnérabilités dépendances**: ${{ needs.dependency-check.outputs.dependency-vulnerabilities || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Type de scan: ${{ github.event.inputs.scan_type || 'full' }}" >> $GITHUB_STEP_SUMMARY
          echo "### 📅 Exécuté le: $(date)" >> $GITHUB_STEP_SUMMARY
