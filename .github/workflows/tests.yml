name: tests

on:
  push:
    branches:
      - '**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect Changed Modules
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            Articles:
              - 'app/Console/Articles/**'
              - 'app/Enums/Articles/**'
              - 'app/Events/Articles/**'
              - 'app/Jobs/Articles/**'
              - 'app/Mails/Articles/**'
              - 'app/Models/Articles/**'
              - 'app/Notifications/Articles/**'
              - 'app/Observers/Articles/**'
              - 'app/Providers/Articles/**'
              - 'app/Services/Articles/**'
              - 'tests/Feature/Modules/Articles/**'
            Chantiers:
              - 'app/Console/Chantiers/**'
              - 'app/Enums/Chantiers/**'
              - 'app/Events/Chantiers/**'
              - 'app/Jobs/Chantiers/**'
              - 'app/Mails/Chantiers/**'
              - 'app/Models/Chantiers/**'
              - 'app/Notifications/Chantiers/**'
              - 'app/Observers/Chantiers/**'
              - 'app/Providers/Chantiers/**'
              - 'app/Services/Chantiers/**'
              - 'tests/Feature/Modules/Chantiers/**'
            Commerce:
              - 'app/Console/Commerce/**'
              - 'app/Enums/Commerce/**'
              - 'app/Events/Commerce/**'
              - 'app/Jobs/Commerce/**'
              - 'app/Mails/Commerce/**'
              - 'app/Models/Commerce/**'
              - 'app/Notifications/Commerce/**'
              - 'app/Observers/Commerce/**'
              - 'app/Providers/Commerce/**'
              - 'app/Services/Commerce/**'
              - 'tests/Feature/Modules/Commerce/**'
            Core:
              - 'app/Console/Core/**'
              - 'app/Enums/Core/**'
              - 'app/Events/Core/**'
              - 'app/Jobs/Core/**'
              - 'app/Mails/Core/**'
              - 'app/Models/Core/**'
              - 'app/Notifications/Core/**'
              - 'app/Observers/Core/**'
              - 'app/Providers/Core/**'
              - 'app/Services/Core/**'
              - 'tests/Feature/Modules/Core/**'
            Flottes:
              - 'app/Console/Flottes/**'
              - 'app/Enums/Flottes/**'
              - 'app/Events/Flottes/**'
              - 'app/Jobs/Flottes/**'
              - 'app/Mails/Flottes/**'
              - 'app/Models/Flottes/**'
              - 'app/Notifications/Flottes/**'
              - 'app/Observers/Flottes/**'
              - 'app/Providers/Flottes/**'
              - 'app/Services/Flottes/**'
              - 'tests/Feature/Modules/Flottes/**'
            RH:
              - 'app/Console/RH/**'
              - 'app/Enums/RH/**'
              - 'app/Events/RH/**'
              - 'app/Jobs/RH/**'
              - 'app/Mails/RH/**'
              - 'app/Models/RH/**'
              - 'app/Notifications/RH/**'
              - 'app/Observers/RH/**'
              - 'app/Providers/RH/**'
              - 'app/Services/RH/**'
              - 'tests/Feature/Modules/RH/**'
            Tiers:
              - 'app/Console/Tiers/**'
              - 'app/Enums/Tiers/**'
              - 'app/Events/Tiers/**'
              - 'app/Jobs/Tiers/**'
              - 'app/Mails/Tiers/**'
              - 'app/Models/Tiers/**'
              - 'app/Notifications/Tiers/**'
              - 'app/Observers/Tiers/**'
              - 'app/Providers/Tiers/**'
              - 'app/Services/Tiers/**'
              - 'tests/Feature/Modules/Tiers/**'
            Banque:
              - 'app/Console/Banque/**'
              - 'app/Enums/Banque/**'
              - 'app/Events/Banque/**'
              - 'app/Jobs/Banque/**'
              - 'app/Mails/Banque/**'
              - 'app/Models/Banque/**'
              - 'app/Notifications/Banque/**'
              - 'app/Observers/Banque/**'
              - 'app/Providers/Banque/**'
              - 'app/Services/Banque/**'
              - 'tests/Feature/Modules/Banque/**'
            Immobilisation:
              - 'app/Console/Immobilisation/**'
              - 'app/Enums/Immobilisation/**'
              - 'app/Events/Immobilisation/**'
              - 'app/Jobs/Immobilisation/**'
              - 'app/Mails/Immobilisation/**'
              - 'app/Models/Immobilisation/**'
              - 'app/Notifications/Immobilisation/**'
              - 'app/Observers/Immobilisation/**'
              - 'app/Providers/Immobilisation/**'
              - 'app/Services/Immobilisation/**'
              - 'tests/Feature/Modules/Immobilisation/**'
            Paie:
              - 'app/Console/Paie/**'
              - 'app/Enums/Paie/**'
              - 'app/Events/Paie/**'
              - 'app/Jobs/Paie/**'
              - 'app/Mails/Paie/**'
              - 'app/Models/Paie/**'
              - 'app/Notifications/Paie/**'
              - 'app/Observers/Paie/**'
              - 'app/Providers/Paie/**'
              - 'app/Services/Paie/**'
              - 'tests/Feature/Modules/Paie/**'
            Gpao:
              - 'app/Console/Gpao/**'
              - 'app/Enums/Gpao/**'
              - 'app/Events/Gpao/**'
              - 'app/Jobs/Gpao/**'
              - 'app/Mails/Gpao/**'
              - 'app/Models/Gpao/**'
              - 'app/Notifications/Gpao/**'
              - 'app/Observers/Gpao/**'
              - 'app/Providers/Gpao/**'
              - 'app/Services/Gpao/**'
              - 'tests/Feature/Modules/Gpao/**'
            Interventions:
              - 'app/Console/Interventions/**'
              - 'app/Enums/Interventions/**'
              - 'app/Events/Interventions/**'
              - 'app/Jobs/Interventions/**'
              - 'app/Mails/Interventions/**'
              - 'app/Models/Interventions/**'
              - 'app/Notifications/Interventions/**'
              - 'app/Observers/Interventions/**'
              - 'app/Providers/Interventions/**'
              - 'app/Services/Interventions/**'
              - 'tests/Feature/Modules/Interventions/**'
            Locations:
              - 'app/Console/Locations/**'
              - 'app/Enums/Locations/**'
              - 'app/Events/Locations/**'
              - 'app/Jobs/Locations/**'
              - 'app/Mails/Locations/**'
              - 'app/Models/Locations/**'
              - 'app/Notifications/Locations/**'
              - 'app/Observers/Locations/**'
              - 'app/Providers/Locations/**'
              - 'app/Services/Locations/**'
              - 'tests/Feature/Modules/Locations/**'
            Vision3D:
              - 'app/Console/Vision3D/**'
              - 'app/Enums/Vision3D/**'
              - 'app/Events/Vision3D/**'
              - 'app/Jobs/Vision3D/**'
              - 'app/Mails/Vision3D/**'
              - 'app/Models/Vision3D/**'
              - 'app/Notifications/Vision3D/**'
              - 'app/Observers/Vision3D/**'
              - 'app/Providers/Vision3D/**'
              - 'app/Services/Vision3D/**'
              - 'tests/Feature/Modules/Vision3D/**'
            Accounting:
              - 'app/Console/Accounting/**'
              - 'app/Enums/Accounting/**'
              - 'app/Events/Accounting/**'
              - 'app/Jobs/Accounting/**'
              - 'app/Mails/Accounting/**'
              - 'app/Models/Accounting/**'
              - 'app/Notifications/Accounting/**'
              - 'app/Observers/Accounting/**'
              - 'app/Providers/Accounting/**'
              - 'app/Services/Accounting/**'
              - 'database/seeders/Accounting/**'
              - 'tests/Feature/Modules/Accounting/**'

  test-modules:
    runs-on: ubuntu-latest
    needs: changes
    environment: Testing
    if: github.event_name == 'push' && needs.changes.outputs.modules != '[]' && needs.changes.outputs.modules != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Puppeter
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Tests and Upload Coverage per Module
        run: |
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          CHANGED_MODULES=$(echo '${{ needs.changes.outputs.modules }}' | jq -r '.[]')

          for MODULE in $CHANGED_MODULES; do
            echo "======================================"
            echo "Testing module: $MODULE"
            echo "======================================"

            if [ "$MODULE" == "Core" ]; then
              ./vendor/bin/pest tests/Feature/Modules/Core tests/Feature/Auth tests/Feature/Settings tests/Feature/*.php tests/Unit --coverage --coverage-clover storage/coverage/coverage-$MODULE.xml --log-junit junit-$MODULE.xml || echo "Tests failed for $MODULE"
            else
              ./vendor/bin/pest tests/Feature/Modules/$MODULE --coverage --coverage-clover storage/coverage/coverage-$MODULE.xml --log-junit junit-$MODULE.xml || echo "Tests failed for $MODULE"
            fi

            echo "Uploading coverage for $MODULE to Codecov..."
            ./codecov upload-process -t ${{ secrets.CODECOV_TOKEN }} -F $MODULE -f storage/coverage/coverage-$MODULE.xml
          done

  test-global:
    runs-on: ubuntu-latest
    environment: Testing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Puppeter
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Global Tests
        run: ./vendor/bin/pest --coverage --coverage-clover storage/coverage/coverage.xml --log-junit junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: BatistackApp/batistack_new
          files: ./storage/coverage/coverage.xml

