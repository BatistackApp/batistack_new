name: tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - master

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect Changed Modules
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            Articles:
              - 'app/Filament/Articles/**'
              - 'tests/Feature/Modules/Articles/**'
            Chantiers:
              - 'app/Filament/Chantier/**'
              - 'tests/Feature/Modules/Chantiers/**'
            Commerce:
              - 'app/Filament/Commerce/**'
              - 'tests/Feature/Modules/Commerce/**'
            Core:
              - 'app/**'
              - '!app/Filament/Articles/**'
              - '!app/Filament/Chantier/**'
              - '!app/Filament/Commerce/**'
              - '!app/Filament/Flottes/**'
              - '!app/Filament/RH/**'
              - '!app/Filament/Tiers/**'
              - 'tests/Feature/Modules/Core/**'
              - 'tests/Feature/Auth/**'
              - 'tests/Feature/Settings/**'
              - 'tests/Feature/*.php'
              - 'tests/Unit/**'
              - 'tests/*.php'
            Flottes:
              - 'app/Filament/Flottes/**'
              - 'tests/Feature/Modules/Flottes/**'
            RH:
              - 'app/Filament/RH/**'
              - 'tests/Feature/Modules/RH/**'
            Tiers:
              - 'app/Filament/Tiers/**'
              - 'tests/Feature/Modules/Tiers/**'

  test-modules:
    runs-on: ubuntu-latest
    needs: changes
    environment: Testing
    if: github.event_name == 'push' && needs.changes.outputs.modules != '[]' && needs.changes.outputs.modules != ''
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
        module: ${{ fromJSON(needs.changes.outputs.modules) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Puppeter
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Tests for Module
        run: |
          if [ "${{ matrix.module }}" == "Core" ]; then
            ./vendor/bin/pest tests/Feature/Modules/Core tests/Feature/Auth tests/Feature/Settings tests/Feature/*.php tests/Unit --coverage --coverage-clover storage/coverage/coverage-${{ matrix.module }}.xml --log-junit junit-${{ matrix.module }}.xml
          else
            ./vendor/bin/pest tests/Feature/Modules/${{ matrix.module }} --coverage --coverage-clover storage/coverage/coverage-${{ matrix.module }}.xml --log-junit junit-${{ matrix.module }}.xml
          fi



  test-global:
    runs-on: ubuntu-latest
    environment: Testing
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    strategy:
      matrix:
        php-version: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Puppeter
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Global Tests
        run: ./vendor/bin/pest --coverage --coverage-clover storage/coverage/coverage.xml --log-junit junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: BatistackApp/batistack_new
          files: ./storage/coverage/coverage.xml

