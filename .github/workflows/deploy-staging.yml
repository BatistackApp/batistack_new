# .github/workflows/deploy-staging.yml
name: Deploy to Staging

on:
  workflow_run:
    workflows: ["Tests & Lint"]
    branches: [master]  # ← DIFFÉRENCE : branch develop au lieu de main
    types: [completed]
  workflow_dispatch:
  pull_request:  # ← NOUVEAU : déployer automatiquement les PR
    types: [synchronize, closed]
    branches: [master]

env:
  AWS_REGION: eu-west-3
  EB_APPLICATION_NAME: batistack-erp  # Même application
  EB_ENVIRONMENT_NAME: batistack-staging  # ← DIFFÉRENCE : environnement différent
  S3_DEPLOYMENT_BUCKET: batistack-deployments

jobs:
  check-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Tests status
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "Tests passed via workflow_run"
          else
            echo "Manual trigger or PR - assuming tests will run separately"
          fi

  build:
    needs: check-tests
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.tag }}
      pr_number: ${{ steps.pr.outputs.number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=none" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, pdo_pgsql, redis, gd, zip
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # ← DIFFÉRENCE : Inclure les dépendances de dev pour le debugging
      - name: Install Composer dependencies
        run: composer install --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      # ← DIFFÉRENCE : Build en mode dev avec sourcemaps
      - name: Build Frontend Assets (Dev mode)
        run: npm run build -- --mode staging

      - name: Create version tag
        id: version
        run: |
          if [ "${{ steps.pr.outputs.number }}" != "none" ]; then
            VERSION="pr-${{ steps.pr.outputs.number }}-$(date +%Y%m%d-%H%M%S)"
          else
            VERSION="staging-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo $VERSION > version.txt

      - name: Prepare deployment package
        run: |
          echo "📦 Création du répertoire de build..."
          mkdir -p build

          echo "📋 Copie des fichiers..."
          # Copier tous les fichiers
          cp -r . build/

          echo "🧹 Nettoyage des fichiers inutiles..."
          # Supprimer les répertoires à exclure
          rm -rf build/.git
          rm -rf build/.github
          rm -rf build/node_modules
          rm -rf build/tests
          rm -rf build/.env*
          rm -rf build/.phpunit.cache
          rm -rf build/storage/app/*
          rm -rf build/storage/framework/cache/*
          rm -rf build/storage/framework/sessions/*
          rm -rf build/storage/framework/views/*
          rm -rf build/storage/logs/*

          echo "📁 Création des répertoires storage..."
          # Recréer les répertoires nécessaires avec .gitkeep
          mkdir -p build/storage/app/public
          mkdir -p build/storage/framework/cache
          mkdir -p build/storage/framework/sessions
          mkdir -p build/storage/framework/views
          mkdir -p build/storage/logs

          # Créer des fichiers .gitkeep pour préserver la structure
          touch build/storage/app/.gitkeep
          touch build/storage/app/public/.gitkeep
          touch build/storage/framework/cache/.gitkeep
          touch build/storage/framework/sessions/.gitkeep
          touch build/storage/framework/views/.gitkeep
          touch build/storage/logs/.gitkeep

          echo "🔐 Configuration des permissions..."
          chmod -R 755 build/storage
          chmod -R 755 build/bootstrap/cache

          echo "✅ Package préparé avec succès"

      - name: Create deployment archive
        run: |
          cd build
          zip -r ../deploy-${{ steps.version.outputs.tag }}.zip . -q
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-staging
          path: deploy-${{ steps.version.outputs.tag }}.zip
          retention-days: 7  # ← DIFFÉRENCE : rétention plus courte

  deploy-to-aws:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging  # ← DIFFÉRENCE : environnement GitHub différent
      url: https://staging.batistack.ovh

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package-staging

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          ARCHIVE=$(ls deploy-*.zip)
          aws s3 cp $ARCHIVE s3://${{ env.S3_DEPLOYMENT_BUCKET }}/staging/$ARCHIVE
          echo "ARCHIVE_NAME=$ARCHIVE" >> $GITHUB_ENV

      - name: Create EB Application Version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label ${{ needs.build.outputs.version }} \
            --description "Staging deploy from ${{ github.ref_name }} - commit ${{ github.sha }}" \
            --source-bundle S3Bucket="${{ env.S3_DEPLOYMENT_BUCKET }}",S3Key="staging/${{ env.ARCHIVE_NAME }}"

      - name: Deploy to Elastic Beanstalk
        id: deploy
        run: |
          aws elasticbeanstalk update-environment \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --version-label ${{ needs.build.outputs.version }}

      - name: Wait for deployment
        run: |
          echo "Attente du déploiement staging..."
          aws elasticbeanstalk wait environment-updated \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --max-attempts 30 \
            --delay 20

  post-deployment:
    needs: [build, deploy-to-aws]
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 instance IDs
        id: get-instances
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:elasticbeanstalk:environment-name,Values=${{ env.EB_ENVIRONMENT_NAME }}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text)
          echo "instances=$INSTANCE_IDS" >> $GITHUB_OUTPUT

      # ← DIFFÉRENCE : Migrations avec --seed pour données de test
      - name: Run database migrations with seeders
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.get-instances.outputs.instances }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /var/app/current",
              "sudo -u webapp php artisan migrate:fresh --force --seed"
            ]' \
            --output text \
            --query 'Command.CommandId')

          echo "Migrations et seeders en cours..."
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id $(echo ${{ steps.get-instances.outputs.instances }} | awk '{print $1}')

          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $(echo ${{ steps.get-instances.outputs.instances }} | awk '{print $1}') \
            --query 'Status' \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Migration failed!"
            exit 1
          fi

      - name: Clear and warm cache
        run: |
          aws ssm send-command \
            --instance-ids ${{ steps.get-instances.outputs.instances }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /var/app/current",
              "sudo -u webapp php artisan optimize:clear",
              "sudo -u webapp php artisan config:cache",
              "sudo -u webapp php artisan route:cache",
              "sudo -u webapp php artisan view:cache",
              "sudo -u webapp php artisan filament:optimize",
              "sudo -u webapp php artisan icons:cache"
            ]'

      - name: Restart queue workers
        run: |
          aws ssm send-command \
            --instance-ids ${{ steps.get-instances.outputs.instances }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo supervisorctl restart laravel-worker:*"
            ]'

      # ← DIFFÉRENCE : Health check sur l'URL de staging
      - name: Health check
        run: |
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://staging.batistack.ovh/health)
            if [ $HTTP_CODE -eq 200 ]; then
              echo "✅ Staging application healthy!"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE - Retrying..."
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

  # ← NOUVEAU : Tests E2E après déploiement staging
  e2e-tests:
    needs: post-deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: https://staging.batistack.ovh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ← NOUVEAU : Commentaire automatique sur la PR
  comment-pr:
    needs: [build, post-deployment]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Déploiement Staging Réussi

              **Version:** \`${{ needs.build.outputs.version }}\`
              **URL:** https://staging.batistack.ovh
              **Commit:** ${{ github.sha }}

              ✅ Migrations appliquées
              ✅ Cache optimisé
              ✅ Health check OK

              Vous pouvez maintenant tester les changements sur l'environnement de staging.`
            })

  notify:
    needs: [build, deploy-to-aws, post-deployment]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment Success Notification
        if: needs.post-deployment.result == 'success'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "✅ Déploiement Staging Réussi",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🧪 Déploiement Staging"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Status:* ✅ Succès"},
                    {"type": "mrkdwn", "text": "*Version:* `${{ needs.build.outputs.version }}`"},
                    {"type": "mrkdwn", "text": "*Branch:* `${{ github.ref_name }}`"},
                    {"type": "mrkdwn", "text": "*Commit:* `${{ github.sha }}`"},
                    {"type": "mrkdwn", "text": "*Auteur:* ${{ github.actor }}"},
                    {"type": "mrkdwn", "text": "*URL:* https://staging.batistack.ovh"}
                  ]
                }
              ]
            }'

      - name: Deployment Failure Notification
        if: needs.post-deployment.result == 'failure' || needs.deploy-to-aws.result == 'failure'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "❌ Échec du Déploiement Staging",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Échec Staging"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Status:* ❌ Échec"},
                    {"type": "mrkdwn", "text": "*Branch:* `${{ github.ref_name }}`"},
                    {"type": "mrkdwn", "text": "*Commit:* `${{ github.sha }}`"},
                    {"type": "mrkdwn", "text": "*Auteur:* ${{ github.actor }}"},
                    {"type": "mrkdwn", "text": "*Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
                  ]
                }
              ]
            }'
