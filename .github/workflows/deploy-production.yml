name: Deploy Production

on:
  pull_request:
    types:
      - closed
    branches:
      - production

jobs:
  release-and-deploy:
    # Ce job s'exécute uniquement si la PR a été mergée (et non fermée sans merge)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version and Push Tag (Semantic Versioning)
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          # Le format sera vX.Y.Z (ex: v1.0.0, v1.0.1, v1.1.0) basé sur les messages de commit

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger AAPanel WebHook Deployment
        run: |
          # Frapper l'URL du webhook de AAPanel pour déclencher le script côté serveur
          curl -X GET "${{ secrets.AAPANEL_WEBHOOK_URL }}"
