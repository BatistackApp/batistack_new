name: Déploiement en production
on:
  push:
    branches: [ production ]
  workflow_run:
    workflows: [ tests, lint ]
    branches: [ production ]
    types: [ completed ]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3
  EB_APPLICATION_NAME: batistack-erp
  EB_ENVIRONMENT_NAME: batistack-prod
  S3_DEPLOYMENT_BUCKET: batistack-deployments

jobs:
  # Vérification que les tests sont passés
  check-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Tests passed
        run: echo "Tests et lint réussis, déploiement autorisé"

  build:
    needs: check-tests
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, pdo_pgsql, redis, gd, zip
          coverage: none

      - name: Recherche du cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Dépendances de Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Installation des dépendances de Composer
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Create version tag
        id: version
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo $VERSION > version.txt

      - name: Préparer le package de déploiement
        run: |
          # Créer le répertoire de build
          mkdir -p build

          # Copier les fichiers nécessaires
          rsync -av --progress . build/ \
            --exclude .git \
            --exclude .github \
            --exclude node_modules \
            --exclude tests \
            --exclude .env \
            --exclude .env.example \
            --exclude .phpunit.cache \
            --exclude storage/app/* \
            --exclude storage/framework/cache/* \
            --exclude storage/framework/sessions/* \
            --exclude storage/framework/views/* \
            --exclude storage/logs/*

          # Créer les répertoires nécessaires dans storage
          mkdir -p build/storage/app/public
          mkdir -p build/storage/framework/{cache,sessions,views}
          mkdir -p build/storage/logs

          # Permissions
          chmod -R 755 build/storage
          chmod -R 755 build/bootstrap/cache

      - name: Create deployment archive
        run: |
          cd build
          zip -r ../deploy-${{ steps.version.outputs.tag }}.zip . -q
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy-${{ steps.version.outputs.tag }}.zip
          retention-days: 30

  deploy-to-aws:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://c2me.batistack.ovh

    steps:
      - name: Téléchargement des Artefacts
        uses: actions/download-artifact@v8
        with:
          name: deployment-package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          ARCHIVE=$(ls deploy-*.zip)
          aws s3 cp $ARCHIVE s3://${{ env.S3_DEPLOYMENT_BUCKET }}/$ARCHIVE
          echo "ARCHIVE_NAME=$ARCHIVE" >> $GITHUB_ENV

      - name: Create EB Application Version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label ${{ needs.build.outputs.version }} \
            --description "Deploy from commit ${{ github.sha }}" \
            --source-bundle S3Bucket="${{ env.S3_DEPLOYMENT_BUCKET }}",S3Key="${{ env.ARCHIVE_NAME }}"

      - name: Deploy to Elastic Beanstalk
        id: deploy
        run: |
          aws elasticbeanstalk update-environment \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --version-label ${{ needs.build.outputs.version }}

          echo "deployment_id=${{ needs.build.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        run: |
          echo "⏳ Attente du déploiement (max 15 minutes)..."
          echo ""

          START_TIME=$(date +%s)
          ATTEMPT=0
          MAX_ATTEMPTS=45  # 45 × 20s = 15 minutes

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          ATTEMPT=$((ATTEMPT + 1))
          ELAPSED=$(($(date +%s) - START_TIME))
          ELAPSED_MIN=$((ELAPSED / 60))
          ELAPSED_SEC=$((ELAPSED % 60))

          # Récupérer les informations de l'environnement
          ENV_INFO=$(aws elasticbeanstalk describe-environments \
          --application-name ${{ env.EB_APPLICATION_NAME }} \
          --environment-names ${{ env.EB_ENVIRONMENT_NAME }} \
          --output json)

          STATUS=$(echo $ENV_INFO | jq -r '.Environments[0].Status')
          HEALTH=$(echo $ENV_INFO | jq -r '.Environments[0].Health')
          HEALTH_STATUS=$(echo $ENV_INFO | jq -r '.Environments[0].HealthStatus // "Unknown"')
          VERSION=$(echo $ENV_INFO | jq -r '.Environments[0].VersionLabel')

          # Afficher le statut
          echo "[$ELAPSED_MIN:$(printf '%02d' $ELAPSED_SEC)] Tentative $ATTEMPT/$MAX_ATTEMPTS"
          echo "   📊 Status: $STATUS"
          echo "   💚 Health: $HEALTH ($HEALTH_STATUS)"
          echo "   📦 Version: $VERSION"

          # Vérifier si le déploiement est terminé
          if [ "$STATUS" = "Ready" ] && [ "$VERSION" = "${{ needs.build.outputs.version }}" ]; then
          echo ""
          echo "✅ Déploiement réussi en ${ELAPSED_MIN}m${ELAPSED_SEC}s!"
          echo "   Version déployée: $VERSION"
          echo "   Health: $HEALTH"
          exit 0
          fi

          # Vérifier les erreurs
          if [ "$STATUS" = "Terminated" ] || [ "$STATUS" = "Terminating" ]; then
          echo ""
          echo "❌ Erreur: Environnement en cours de terminaison"
          exit 1
          fi

          # Récupérer les derniers événements pour voir ce qui se passe
          if [ $((ATTEMPT % 3)) -eq 0 ]; then
          echo "   📝 Derniers événements:"
          aws elasticbeanstalk describe-events \
          --application-name ${{ env.EB_APPLICATION_NAME }} \
          --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
          --max-records 3 \
          --query 'Events[*].[EventDate,Severity,Message]' \
          --output text | sed 's/^/      /'
          fi

          echo ""
          sleep 20
          done

          echo "❌ Timeout: Le déploiement a dépassé 15 minutes"
          echo ""
          echo "📋 Derniers événements:"
          aws elasticbeanstalk describe-events \
          --application-name ${{ env.EB_APPLICATION_NAME }} \
          --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
          --max-records 10 \
          --query 'Events[*].[EventDate,Severity,Message]' \
          --output table
          exit 1

  post-deployment:
    needs:
      - build
      - deploy-to-aws
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 instance IDs
        id: get-instances
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:elasticbeanstalk:environment-name,Values=${{ env.EB_ENVIRONMENT_NAME }}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text)
          echo "instances=$INSTANCE_IDS" >> $GITHUB_OUTPUT

      - name: Run database migration
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.get-instances.outputs.instances }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /var/app/current",
              "sudo -u webapp php artisan migrate --force --isolated"
            ]' \
            --output text \
            --query 'Command.CommandId')

          echo "Waiting for migrations..."
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id $(echo ${{ steps.get-instances.outputs.instances }} | awk '{print $1}')

          # Vérifier le statut
          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $(echo ${{ steps.get-instances.outputs.instances }} | awk '{print $1}') \
            --query 'Status' \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Migration failed!"
            exit 1
          fi

      - name: Clear and warm cache
        run: |
          aws ssm send-command \
            --instance-ids ${{ steps.get-instances.outputs.instances }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /var/app/current",
              "sudo -u webapp php artisan optimize:clear",
              "sudo -u webapp php artisan config:cache",
              "sudo -u webapp php artisan route:cache",
              "sudo -u webapp php artisan view:cache",
              "sudo -u webapp php artisan filament:optimize",
              "sudo -u webapp php artisan icons:cache"
            ]'

      - name: Restart Queue Workers
        run: |
          aws ssm send-command \
            --instance-ids ${{ steps.get-instances.outputs.instances }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo supervisorctl restart laravel-worker:*"
            ]'

      - name: Health check
        run: |
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://batistack.ovh/health)
            if [ $HTTP_CODE -eq 200 ]; then
              echo "✅ Application healthy!"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE - Retrying..."
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

  notify:
    needs: [build, deploy-to-aws, post-deployment]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment Success Notification
        if: needs.post-deployment.result == 'success'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "✅ Déploiement Production Réussi",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Déploiement Production"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Status:* ✅ Succès"},
                    {"type": "mrkdwn", "text": "*Version:* `${{ needs.build.outputs.version }}`"},
                    {"type": "mrkdwn", "text": "*Branch:* `${{ github.ref_name }}`"},
                    {"type": "mrkdwn", "text": "*Commit:* `${{ github.sha }}`"},
                    {"type": "mrkdwn", "text": "*Auteur:* ${{ github.actor }}"},
                    {"type": "mrkdwn", "text": "*URL:* https://batistack.ovh"}
                  ]
                }
              ]
            }'

      - name: Deployment Failure Notification
        if: needs.post-deployment.result == 'failure' || needs.deploy-to-aws.result == 'failure'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "❌ Échec du Déploiement Production",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Échec Déploiement"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Status:* ❌ Échec"},
                    {"type": "mrkdwn", "text": "*Branch:* `${{ github.ref_name }}`"},
                    {"type": "mrkdwn", "text": "*Commit:* `${{ github.sha }}`"},
                    {"type": "mrkdwn", "text": "*Auteur:* ${{ github.actor }}"},
                    {"type": "mrkdwn", "text": "*Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
                  ]
                }
              ]
            }'

  rollback-on-failure:
    needs: [deploy-to-aws, post-deployment]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get previous version
        id: previous
        run: |
          PREVIOUS_VERSION=$(aws elasticbeanstalk describe-environments \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-names ${{ env.EB_ENVIRONMENT_NAME }} \
            --query 'Environments[0].VersionLabel' \
            --output text)
          echo "version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT

      - name: Rollback to previous version
        run: |
          echo "🔄 Rollback vers la version ${{ steps.previous.outputs.version }}"
          aws elasticbeanstalk update-environment \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --version-label ${{ steps.previous.outputs.version }}
