# Configuration pour actions/labeler
# Labels automatiques basés sur les chemins de fichiers modifiés

# ============================================
# CORE
# ============================================
core:
  - changed-files:
      - any-glob-to-any-file:
          - app/Models/Core/**
          - app/Services/Core/**
          - app/Console/Commands/Core/**
          - app/Filament/Resources/**
          - app/Filament/Pages/**
          - app/Filament/Widgets/**
          - config/**
          - database/migrations/*core*
          - docs/Modules/fr/Core/**

