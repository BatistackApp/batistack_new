# ============================================
# TYPES DE CHANGEMENTS
# ============================================

# Dépendances
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - composer.json
          - composer.lock
          - package.json
          - package-lock.json

# Base de données
database:
  - changed-files:
      - any-glob-to-any-file:
          - database/**
          - app/Models/**

# Tests
tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - README.md
          - CHANGELOG.md

# Configuration
config:
  - changed-files:
      - any-glob-to-any-file:
          - config/**
          - .env*
          - docker-compose*.yml

# CI/CD
ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

# ============================================
# PRIORITÉS
# ============================================

# Bug fix
bugfix:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.php'
          - '**/*.js'
          - '**/*.ts'

# Nouvelle feature
feature:
  - changed-files:
      - any-glob-to-any-file:
          - app/Filament/**
          - app/Services/**
          - app/Models/**
